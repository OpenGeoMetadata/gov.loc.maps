[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loc-maps"
version = "0.1.0"
description = "Resumable Library of Congress maps to OpenGeoMetadata Aardvark pipeline"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
loc-maps = "loc_maps.cli:main"

[tool.setuptools.packages.find]
include = ["loc_maps*"]

[tool.setuptools.package-data]
loc_maps = ["schemas/*.json", "schemas/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
