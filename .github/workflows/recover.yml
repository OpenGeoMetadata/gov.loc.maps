name: Recover paused LOC bootstrap
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: First recovered batch budget (continuations use the normal budget)
        type: string
        default: '700'
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: loc-maps-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: vars.LOC_MAPS_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      MODE: full
      MAX_REQUESTS: ${{ inputs.max_requests || '700' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python .github/scripts/automation.py recover
